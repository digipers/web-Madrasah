<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Berita - MA. Ash Shidiqi Rajabasa Baru</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .text-emas { color: #d4af37; }
    .bg-hijau { background-color: #0B5D3B; }
    
    /* Styling agar gambar di dalam isi berita rapi */
    .isi-berita img {
      max-width: 100%;
      height: auto;
      display: block;
      margin: 20px auto;
      border-radius: 8px;
    }
    .isi-berita p {
      margin-bottom: 15px;
      line-height: 1.8;
    }
  </style>
</head>
<body class="bg-gray-50 font-sans text-gray-800">

  <!-- Header / Navbar -->
  <header class="bg-hijau text-white p-4 shadow-md">
    <div class="container mx-auto flex justify-between items-center">
      <h1 class="text-xl font-bold">MA. Ash Shidiqi Rajabasa Baru</h1>
      <nav class="space-x-4">
        <a href="index.html" class="hover:underline">Beranda</a>
        <a href="#" class="font-bold underline">Berita</a>
        <a href="#" class="hover:underline">Profil</a>
      </nav>
    </div>
  </header>

  <!-- Konten Utama -->
  <main class="container mx-auto mt-8 px-4 max-w-4xl bg-white p-6 md:p-10 rounded-lg shadow-sm my-10">
    
    <!-- ================= HALAMAN DAFTAR BERITA ================= -->
    <div id="halaman-daftar">
      <h2 class="text-2xl font-bold mb-6 border-b-2 border-gray-300 pb-2">Berita Terbaru</h2>
      <div id="berita-container" class="space-y-8">
        <p class="text-center text-gray-500">Memuat berita...</p>
      </div>
    </div>

    <!-- ================= HALAMAN DETAIL BERITA ================= -->
    <div id="halaman-detail" class="hidden">
      <div id="detail-container">
        <!-- Isi detail akan dimuat di sini -->
      </div>
      <div class="mt-10 pt-6 border-t border-gray-200">
        <a href="#" onclick="kembaliKeDaftar(event)" class="text-blue-600 font-semibold hover:underline">&larr; Kembali ke Daftar Berita</a>
      </div>
    </div>

  </main>

  <script>
    // GANTI URL DI BAWAH INI DENGAN URL WEB APP APPS SCRIPT ANDA
    const API_URL = "https://script.google.com/macros/s/XXXXX/exec";

    // Fungsi untuk memuat daftar berita
    async function loadDaftarBerita() {
      const container = document.getElementById('berita-container');
      container.innerHTML = '<p class="text-center text-gray-500">Memuat berita...</p>';
      
      try {
        const response = await fetch(API_URL + "?action=getNews");
        const result = await response.json();

        if (result.success && result.data.length > 0) {
          const beritaTerbaru = result.data.reverse(); 
          container.innerHTML = ''; // Hapus loading

          beritaTerbaru.forEach(berita => {
            let imgUrl = berita.image ? berita.image : 'https://via.placeholder.com/300x200?text=No+Image';
            
            // Tombol Baca Selengkapnya memanggil fungsi JS, bukan link pindah halaman
            const html = `
              <div class="flex flex-col md:flex-row gap-6 bg-white p-4 rounded-lg shadow-sm border border-gray-200">
                <div class="w-full md:w-1/3 flex-shrink-0">
                  <img src="${imgUrl}" alt="${berita.title}" class="w-full h-auto rounded object-cover border">
                </div>
                <div class="w-full md:w-2/3 flex flex-col justify-between">
                  <div>
                    <h3 class="text-xl font-bold text-emas">${berita.title}</h3>
                    <p class="text-sm text-gray-500 mt-1 mb-3">${berita.published_at} | 0 comments</p>
                    <p class="text-gray-700 text-sm leading-relaxed mb-4">
                      ${berita.excerpt ? berita.excerpt : 'Tidak ada ringkasan.'}
                    </p>
                  </div>
                  <a href="#" onclick="bukaDetail(event, '${berita.id}')" class="text-blue-600 font-semibold hover:text-blue-800 text-sm mt-auto">
                    Baca Selengkapnya &rarr;
                  </a>
                </div>
              </div>
            `;
            container.innerHTML += html;
          });
        } else {
          container.innerHTML = '<p class="text-center text-gray-500">Belum ada berita.</p>';
        }
      } catch (error) {
        console.error(error);
        container.innerHTML = '<p class="text-center text-red-500">Gagal memuat berita.</p>';
      }
    }

    // Fungsi untuk membuka detail berita
    async function bukaDetail(event, id) {
      if (event) event.preventDefault(); // Mencegah halaman refresh
      
      // Sembunyikan daftar, tampilkan detail
      document.getElementById('halaman-daftar').classList.add('hidden');
      document.getElementById('halaman-detail').classList.remove('hidden');

      const container = document.getElementById('detail-container');
      container.innerHTML = '<p class="text-center text-gray-500">Memuat detail berita...</p>';

      try {
        const response = await fetch(API_URL + "?action=getNewsDetail&id=" + id);
        const result = await response.json();

        if (result.success && result.data) {
          const berita = result.data;
          
          const html = `
            <h1 class="text-2xl md:text-3xl font-bold text-emas mb-2">${berita.title}</h1>
            <p class="text-sm text-gray-500 mb-6 border-b pb-4">${berita.published_at} | Kategori: ${berita.category || 'Umum'}</p>
            
            <div class="isi-berita text-gray-700">
              <!-- Render isi berita -->
              ${berita.content}
            </div>
          `;
          container.innerHTML = html;
        } else {
          container.innerHTML = '<p class="text-center text-red-500">Berita tidak ditemukan.</p>';
        }
      } catch (error) {
        console.error(error);
        container.innerHTML = '<p class="text-center text-red-500">Gagal memuat detail berita.</p>';
      }
    }

    // Fungsi untuk kembali ke daftar berita
    function kembaliKeDaftar(event) {
      if (event) event.preventDefault();
      document.getElementById('halaman-detail').classList.add('hidden');
      document.getElementById('halaman-daftar').classList.remove('hidden');
    }

    // Jalankan fungsi memuat daftar berita saat pertama kali dibuka
    window.onload = loadDaftarBerita;
  </script>
</body>
</html>
